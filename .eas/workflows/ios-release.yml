# Builds the iOS app and submits it to App Store Connect.
# Runs when .github/ios-release changes on main.
name: iOS release

on:
  push:
    branches: ['main']
    paths: ['.github/ios-release']

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
