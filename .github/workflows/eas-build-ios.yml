name: iOS build and submit

# Builds the iOS app on EAS and sends it to App Store Connect.
# Runs when a tag like ios-v1.0.1 is pushed, or by hand from the Actions tab.
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
